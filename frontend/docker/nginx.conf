# Auslieferung der statischen Nuxt-SPA. Caddy im Stack terminiert TLS und leitet
# alles außer /api/* und /health hierher (frontend:3000).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx lauscht intern auf :3000 hinter Caddy (TLS-Terminierung). Ohne dies
    # baut nginx den Trailing-Slash-Redirect (z. B. /mitarbeiter -> /mitarbeiter/)
    # ABSOLUT aus seinem eigenen Port/Schema: http://host:3000/mitarbeiter/ —
    # unerreichbar. Relativ ausgeben => Browser behält https://host/.
    absolute_redirect off;

    # Security-Header (login-hardening, Spec Abschnitt 3). "always" auch auf
    # Fehlerantworten. Muss inhaltlich mit nuxt.config.ts routeRules (Dev)
    # uebereinstimmen.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # SPA-Fallback: unbekannte Pfade an index.html (Client-seitiges Routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
